name: HereShift Android APK (Drive mirror)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Development/Apps/HereShift/Android App/**'
      - 'Development/Apps/_template/03_Audio_Settings/generate_audio.py'
      - '.github/workflows/hereshift-android-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original sound/image generators
        run: pip install numpy cairosvg
      - name: Reproduce approved original sound cues and branded app icons
        env:
          PEO_AUDIO_OUT: ${{ github.workspace }}/.generated/audio
        run: |
          python 'Development/Apps/_template/03_Audio_Settings/generate_audio.py'
          python 'Development/Apps/HereShift/Android App/build_icons.py'
          python - <<'PYGEN'
          from pathlib import Path
          import shutil
          p=Path('Development/Apps/HereShift/Android App/app/src/main/assets/sounds')
          p.mkdir(parents=True,exist_ok=True)
          source=Path('.generated/audio/sounds')
          assert len(list(source.rglob('*.wav')))==240
          for f in source.rglob('*.wav'):
            dst=p/f.relative_to(source)
            dst.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(f,dst)
          PYGEN
      - name: Verify generated WAV hashes
        run: |
          python - <<'PYVERIFY'
          from pathlib import Path
          import json,hashlib
          app=Path('Development/Apps/HereShift/Android App/app/src/main/assets')
          j=json.loads((app/'audio_themes_manifest.json').read_text())
          soundcount=0
          for theme in j['themes']:
            for clip in theme['sounds']:
              f=app/'sounds'/clip['filename']
              assert f.is_file(), str(f)
              assert hashlib.sha256(f.read_bytes()).hexdigest()==clip['sha256'], str(f)
              soundcount+=1
          assert soundcount==240
          print('Verified',soundcount,'original audio clips')
          PYVERIFY
      - name: Compile HereShift debug APK
        working-directory: Development/Apps/HereShift/Android App
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish debuggable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HereShift-debug-apk
          path: Development/Apps/HereShift/Android App/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error