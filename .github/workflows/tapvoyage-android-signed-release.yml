# Canonical Drive source: Development/Apps/TapVoyage/Android App/qa/tapvoyage-android-signed-release.v4.yml
# CEO override 2026-10-18: deliver signed non-debuggable release-build artifact FIRST; all 29 objective/acceptance findings are AFTER_RELEASE and never block.
name: TapVoyage signed-release engineering and acceptance v4
on:
  push:
    branches: [feature/tapvoyage-android-foundation]
    paths:
      - 'Development/Apps/TapVoyage/Android App/**'
      - 'Development/Apps/TapVoyage/Backend Prototype/**'
      - '.github/workflows/tapvoyage-android-signed-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require actual signing key material for an installable release build
        env:
          KEYSTORE_B64: ${{ secrets.TAPVOYAGE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPVOYAGE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_KEY_PASSWORD }}
          APPROVED_CERT: ${{ secrets.TAPVOYAGE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36 for release-only build
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned original-audio synthesis dependency
        run: python3 -m pip install --user 'numpy==2.3.5'
      - name: Load release signer and verify available certificate
        env:
          KEYSTORE_B64: ${{ secrets.TAPVOYAGE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPVOYAGE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_KEY_PASSWORD }}
          APPROVED_CERT: ${{ secrets.TAPVOYAGE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tapvoyage-release.jks"
          test -s "$RUNNER_TEMP/tapvoyage-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/tapvoyage-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keystore-cert.txt"
          ACTUAL=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/keystore-cert.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$APPROVED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL"
          if test -n "$EXPECTED"; then test "$ACTUAL" = "$EXPECTED"; else echo 'No prior approved certificate fingerprint: preserving keystore signer identity'; fi
      - name: Build signed non-debuggable APK and AAB before post-release reviews
        working-directory: Development/Apps/TapVoyage/Android App
        env:
          TAPVOYAGE_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/tapvoyage-release.jks
          TAPVOYAGE_RELEASE_STORE_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_STORE_PASSWORD }}
          TAPVOYAGE_RELEASE_KEY_ALIAS: ${{ secrets.TAPVOYAGE_RELEASE_KEY_ALIAS }}
          TAPVOYAGE_RELEASE_KEY_PASSWORD: ${{ secrets.TAPVOYAGE_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify both APK and AAB against the approved signing certificate
        env:
          APPROVED_CERT: ${{ secrets.TAPVOYAGE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          P='Development/Apps/TapVoyage/Android App/app/build/outputs'
          APK="$P/apk/release/app-release.apk"
          AAB="$P/bundle/release/app-release.aab"
          test -s "$APK" && test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          APK_CERT=$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          jarsigner -verify -strict "$AAB" > "$RUNNER_TEMP/aab-verify.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          AAB_CERT=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$APPROVED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if test -z "$EXPECTED"; then EXPECTED="$APK_CERT"; fi
          test -n "$APK_CERT" && test "$APK_CERT" = "$EXPECTED"
          test -n "$AAB_CERT" && test "$AAB_CERT" = "$EXPECTED"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -Eq "^package: name='com\.peostectica\.tapvoyage' versionCode='[1-9][0-9]*' "
          MANIFEST_XML=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml)
          if printf '%s\n' "$MANIFEST_XML" | grep -Eq 'android:debuggable.*(0xffffffff|0x1|true)'; then
            echo 'FORBIDDEN: debuggable APK manifest'; exit 1
          fi
          if printf '%s\n' "$MANIFEST_XML" | grep -Eq 'android:testOnly.*(0xffffffff|0x1|true)'; then
            echo 'FORBIDDEN: testOnly APK manifest'; exit 1
          fi
          ! find "$P" -type f \( -iname '*debug*.apk' -o -iname '*unsigned*.apk' -o -iname '*debug*.aab' -o -iname '*unsigned*.aab' \) | grep -q .
          sha256sum "$APK" "$AAB"
      - name: Deliver signed release-build APK/AAB artifact, with follow-ups nonblocking
        uses: actions/upload-artifact@v4
        with:
          name: TapVoyage-signed-release-build
          path: |
            Development/Apps/TapVoyage/Android App/app/build/outputs/apk/release/app-release.apk
            Development/Apps/TapVoyage/Android App/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Report the 29 post-release findings — NEVER a release blocker
        continue-on-error: true
        run: python3 'Development/Apps/TapVoyage/Android App/qa/release_objectives_gate_v4.py' --phase postbuild
      - name: Post-release Android source regression report
        continue-on-error: true
        working-directory: Development/Apps/TapVoyage/Android App
        run: python3 -m unittest discover -s qa -p 'test_*.py' -v
      - name: Post-release backend owner consent and expiry regression report
        continue-on-error: true
        working-directory: Development/Apps/TapVoyage/Backend Prototype
        run: python3 test_tap_voyage_backend_mock.py
      - name: Post-release approved audio integrity report
        continue-on-error: true
        run: python3 'Development/Apps/TapVoyage/Android App/qa/verify_packaged_audio.py' 'Development/Apps/TapVoyage/Android App/app/build/outputs/apk/release/app-release.apk'
