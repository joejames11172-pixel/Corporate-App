name: HereShift emulator screen checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Development/Apps/HereShift/Android App/**'
      - 'Development/Apps/_template/03_Audio_Settings/generate_audio.py'
      - '.github/workflows/hereshift-android-emulator.yml'
permissions:
  contents: read
jobs:
  emulator-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project asset generators
        run: pip install numpy cairosvg
      - name: Generate and verify audio / icons
        env:
          PEO_AUDIO_OUT: ${{ github.workspace }}/.generated/audio
        run: |
          python 'Development/Apps/_template/03_Audio_Settings/generate_audio.py'
          python 'Development/Apps/HereShift/Android App/build_icons.py'
          python - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          source=Path('.generated/audio/sounds')
          assets=Path('Development/Apps/HereShift/Android App/app/src/main/assets')
          manifest=json.loads((assets/'audio_themes_manifest.json').read_text())
          count=0
          for theme in manifest['themes']:
            for clip in theme['sounds']:
              src=source/clip['filename'];target=assets/'sounds'/clip['filename']
              assert src.is_file() and hashlib.sha256(src.read_bytes()).hexdigest()==clip['sha256']
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,target)
              count+=1
          assert count==240
          print('PASS audio integrity',count)
          PY
      - name: Build test APK
        working-directory: Development/Apps/HereShift/Android App
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android emulator and inspect app UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash 'Development/Apps/HereShift/Android App/qa/emulator_smoke.sh'
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HereShift-emulator-screen-evidence
          path: qa-results/
          retention-days: 14
          if-no-files-found: warn